[package]
name = "icm-mcp"
version = "0.10.34"
edition = "2021"

[features]
default = ["backend-sqlite"]
embeddings = ["icm-core/embeddings"]
# Storage backend selection is driven by the binary crate (icm-cli); these
# pass-through features let `cargo test -p icm-mcp` pick one directly.
backend-sqlite = ["icm-store/backend-sqlite"]
postgres = ["icm-store/postgres"]
opensearch = ["icm-store/opensearch"]
# Pass-through for the remote store client (F-001) so `cargo test -p
# icm-mcp --features remote-store` can exercise the MCP server against a
# remote backend.
remote-store = ["icm-store/remote-store"]

[dependencies]
icm-core = { path = "../icm-core" }
icm-store = { path = "../icm-store", default-features = false }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
