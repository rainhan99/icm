# ICM Configuration
#
# Location (platform-specific):
#   macOS:   ~/Library/Application Support/dev.icm.icm/config.toml
#   Linux:   ~/.config/icm/config.toml
#   Windows: C:\Users\<user>\AppData\Roaming\icm\icm\config\config.toml
# Or override with: ICM_CONFIG=/path/to/config.toml

[store]
# SQLite database path (default: platform data dir).
# Uncomment to use a custom location:
# path = "/custom/path/to/memories.db"

[memory]
default_importance = "medium"

# Decay rate per day (0.95 = loses 5% per day)
decay_rate = 0.95

# Weight threshold for automatic pruning
prune_threshold = 0.1

# --- Supersession (F-003) ---
# When storing a new memory, if an existing ACTIVE memory in the same topic
# is at least this cosine-similar, the old one is marked "superseded" and the
# new one is stored (temporal history preserved), instead of the two coexisting.
# Superseded memories are hidden from recall/list by default; `--include-superseded`
# reveals them. This is NEAR-DUPLICATE detection, not semantic-contradiction
# detection (e.g. "lives in NYC" -> "moved to SF" has low similarity and is NOT
# caught here — that needs an LLM, out of scope).
# Range 0..1. Set >= 1.0 to DISABLE supersession entirely (behaves like today's
# pure dedup — fully backward compatible). Default: 0.90.
supersede_threshold = 0.90

[embeddings]
# Set to false to disable embeddings entirely (no model download, keyword search only)
# enabled = false

# Embedding model (fastembed model_code). Default: multilingual-e5-small (384d, 100+ languages)
# Other options:
#   "BAAI/bge-small-en-v1.5"              — 384d, English-only (fastest)
#   "Xenova/bge-small-en-v1.5"            — 384d, quantized English-only
#   "intfloat/multilingual-e5-base"       — 768d, multilingual (more accurate, slower)
#   "intfloat/multilingual-e5-large"      — 1024d, multilingual (best accuracy, largest)
#   "Xenova/all-MiniLM-L12-v2"            — 384d, English
#   "jinaai/jina-embeddings-v2-base-code" — 768d, code-optimized
model = "intfloat/multilingual-e5-base"

# --- Cloud embeddings (F-001, requires the `cloud-embeddings` build feature) ---
# provider selects where embeddings are computed:
#   "local"  (default) — on-device fastembed model above
#   "openai"           — any OpenAI-compatible /embeddings endpoint
# provider = "openai"
#
# For provider = "openai":
#   - `model` above becomes the cloud model name, e.g. "text-embedding-3-small"
#   - base_url is the API root (up to /v1); /embeddings is appended
#   - dimensions is the model's output size (must match the store's dim;
#     switching dims requires `icm embed --force` to re-embed)
#   - the API key comes from env ICM_EMBED_API_KEY (falls back to OPENAI_API_KEY),
#     never from this file, and is never logged
# base_url = "https://api.openai.com/v1"
# dimensions = 1536
#
# Repeated embeddings are cached (disk + in-memory LRU) under the platform
# cache dir; view usage at http://<server>/cache when running `icm serve --http`.

# --- Code graph (F-002, requires the default `code-graph` build feature) ---
# The code graph indexes symbols + call edges (Rust/TS-JS/Python/Go) so
# agents query dependencies from a pre-built index (icm_code_explore)
# instead of grep/read — saving tokens. It has no config keys of its own
# yet: build it with `icm code index`, and it shares the store selected by
# `ICM_DB_BACKEND` (including `remote` for cross-machine sharing). The
# PostToolUse hook marks edited files stale for `icm code index
# --incremental`. See docs/code-graph.md.

[extraction]
# Layer 0: rule-based fact extraction (zero LLM cost)
enabled = true

# Minimum keyword score to keep a fact
min_score = 3.0

# Maximum facts per extraction pass
max_facts = 10

# Extract every N PostToolUse hook fires (i.e. every N tool calls in a
# Claude Code / Gemini / Codex / Copilot session). Lower = more
# aggressive (more memories, more noise); higher = quieter. The
# `--every` CLI flag on `icm hook post` overrides this.
extract_every = 3

# Store the raw tool output as a low-importance memory when the
# rule-based extractor produces no facts. Useful as a coarse safety
# net; set to `false` if you only want signal-rich extractions.
store_raw = true

[recall]
# Layer 2: context injection before sessions
enabled = true

# Maximum memories to inject
limit = 15

[wakeup]
# SessionStart hook (Layer 1): wake-up pack of critical/high-importance
# memories injected at session start.

# Token budget for the pack (~4 chars/token). Increase for richer context;
# decrease if your tool's system prompt is already tight.
max_tokens = 500

# Include preference / identity memories regardless of project filter so
# user-wide settings (style, language, conventions) leak through into
# every project's wake-up.
include_preferences = true

[mcp]
# MCP server transport: "stdio"
transport = "stdio"

# Custom instructions appended to MCP server description
# instructions = "Always recall before starting work"

# --- Remote server auth scaffold (F-003, `icm serve --http`) ---
#
# ⚠️  SCAFFOLD ONLY — resolves IDENTITY, does NOT isolate data.
# A populated `tokens` map makes the HTTP server multi-tenant AWARE: it maps
# each incoming `Authorization: Bearer <token>` to a tenant name, rejects
# unknown tokens with 401, and logs/echoes (via GET /whoami) the resolved
# tenant — never the token. But every tenant STILL SHARES ONE STORE: this does
# NOT isolate one tenant's memories from another's. Cross-tenant data isolation
# (Postgres row-level tenant + RLS) is deferred to F-003b. Do NOT deploy this
# as a security boundary between mutually distrusting tenants.
#
# Leave empty (default) for F-001 single-token behavior: the one global
# `--token` guards the server and /whoami reports tenant "default".
#
# [remote.tokens]
# "s3cr3t-token-for-team-a" = "team-a"
# "s3cr3t-token-for-team-b" = "team-b"
